name: Keep Render Server Awake

on:
  schedule:
    # Runs every 12 minutes (Render Free Tier sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual run anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping n8n Render Service
        run: |
          echo "Pinging https://n8n-5yi2.onrender.com/healthz ..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://n8n-5yi2.onrender.com/healthz)
          echo "HTTP Response Code: $response"
