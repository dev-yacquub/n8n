name: Keep Render Server Awake

on:
  schedule:
    # Runs every 12 minutes (Render Free Tier sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual run anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping SocialCommander Render Service
        run: |
          echo "Pinging https://yacquub-social-commander-agent.onrender.com/ ..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -m 60 https://yacquub-social-commander-agent.onrender.com/)
          echo "HTTP Response Code: $response"
